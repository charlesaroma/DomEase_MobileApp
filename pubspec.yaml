name: domease
description: "DomEase (Domestic Ease): meals, cleaning and one shared shopping list for Ugandan homes."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  # Brand type (SIL Open Font Licence, assets/fonts/OFL.txt). Outfit and Inter
  # are variable; weights are applied with FontVariation (ui/core/themes/typography.dart).
  # Lustria is the logo's face; the logo itself is drawn from paths, not text.
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-VariableFont_wght.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
    - family: Lustria
      fonts:
        - asset: assets/fonts/Lustria-Regular.ttf

# ─── App icon ─────────────────────────────────────────────────────
# The platform icons are already generated in android/, ios/ and web/ from the
# approved logo (icon cut). To regenerate from these sources after a change:
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  image_path: assets/icon/app-icon.png
  ios: true
  remove_alpha_ios: true # App Store Connect rejects icons with transparency
  android: true
  min_sdk_android: 21
  adaptive_icon_background: "#874628"
  adaptive_icon_foreground: assets/icon/adaptive-foreground.png
  adaptive_icon_monochrome: assets/icon/adaptive-monochrome.png # Android 13 themed icons
